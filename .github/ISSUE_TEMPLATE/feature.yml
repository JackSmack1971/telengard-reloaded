name: Feature proposal
description: Propose a focused, evidence-backed improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or player need
      description: What problem should this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful outcome without prescribing speculative architecture.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: Note determinism, save compatibility, hidden-information, or presentation-boundary considerations.
  - type: checkboxes
    id: checks
    attributes:
      label: Triage checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I have removed secrets and private data from this report.
          required: true
