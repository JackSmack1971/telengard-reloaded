name: Support question
description: Ask a focused question about using or developing the project.
title: "[Support]: "
labels:
  - question

body:
  - type: markdown
    attributes:
      value: |
        Use this form for how-to or understanding questions.
        If you can reproduce incorrect behavior, use the Bug report form instead.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help understanding or doing?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context and what you tried
      description: |
        What have you already tried? Include the relevant command, revision,
        environment, or documentation section only when it matters.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Triage checks
      options:
        - label: I searched the documentation and existing issues first.
          required: true
