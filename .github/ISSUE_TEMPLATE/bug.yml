name: Bug report
description: Report a reproducible problem in the simulation, tooling, or presentation boundary.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Provide enough detail for the issue to be reproduced without access to private data.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include commands, inputs, seed/version values, and the smallest useful example.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or version
      description: Provide the commit, release, or save/simulation version if known.
  - type: checkboxes
    id: checks
    attributes:
      label: Triage checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I have removed secrets and private data from this report.
          required: true
