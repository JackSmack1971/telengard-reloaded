name: Repository verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Full verification
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up the repository SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.100

      - name: Prepare verification stamp directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .codex | Out-Null

      - name: Check agent control plane
        shell: pwsh
        run: ./eng/control-plane.ps1 -Mode Check

      - name: Check generated audit status
        shell: pwsh
        run: ./eng/audit-status.ps1 -Mode Check

      - name: Run focused structural checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/control-plane.tests.ps1
          ./eng/audit-status.tests.ps1
          ./eng/task-index.tests.ps1

      - name: Run the canonical verification gate
        shell: pwsh
        run: ./eng/verify.ps1 -Mode Full
